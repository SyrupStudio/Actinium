name: Build Actinium

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2022_64'
          modules: ''

      - name: Install NSIS
        run: choco install nsis -y

      - name: Configure
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        run: |
          windeployqt --release build/Actinium.exe

      - name: Package (CPack: NSIS installer + ZIP)
        working-directory: build
        run: cpack -C Release

      - uses: actions/upload-artifact@v4
        with:
          name: actinium-windows
          path: |
            build/*.exe
            build/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm ninja-build

      - name: Configure
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build

      - name: Package (CPack: TGZ + DEB + RPM)
        working-directory: build
        run: cpack

      - uses: actions/upload-artifact@v4
        with:
          name: actinium-linux
          path: |
            build/*.tar.gz
            build/*.deb
            build/*.rpm

  macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'

      - name: Configure
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build

      - name: Deploy Qt runtime into .app bundle
        run: macdeployqt build/Actinium.app

      - name: Package (CPack: DragNDrop .dmg)
        working-directory: build
        run: cpack

      - uses: actions/upload-artifact@v4
        with:
          name: actinium-macos
          path: |
            build/*.dmg
