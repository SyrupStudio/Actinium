name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: Actinium

jobs:
  windows-msi:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '--ciSkip')
    runs-on: windows-latest
    env:
      CXXFLAGS: /wd4865
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build release
        run: cargo build --release

      - name: Init wix (first run only — safe to re-run with --force)
        run: cargo wix init --force
        continue-on-error: true

      - name: Build MSI
        run: cargo wix --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-msi
          path: target/wix/*.msi

  windows-portable:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '--ciSkip')
    runs-on: windows-latest
    env:
      CXXFLAGS: /wd4865
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package portable zip
        run: |
          mkdir portable
          copy target\release\${{ env.APP_NAME }}.exe portable\
          if (Test-Path assets) { Copy-Item -Recurse assets portable\assets }
          Compress-Archive -Path portable\* -DestinationPath ${{ env.APP_NAME }}-windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-portable
          path: ${{ env.APP_NAME }}-windows-portable.zip

  macos-app:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '--ciSkip')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build both architectures
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Merge into a universal binary
        run: |
          mkdir -p target/universal/release
          lipo -create \
            target/x86_64-apple-darwin/release/${{ env.APP_NAME }} \
            target/aarch64-apple-darwin/release/${{ env.APP_NAME }} \
            -output target/universal/release/${{ env.APP_NAME }}
          lipo -info target/universal/release/${{ env.APP_NAME }}

      - name: Build .app bundle around the universal binary
        run: |
          cargo bundle --release
          cp target/universal/release/${{ env.APP_NAME }} \
            "target/release/bundle/osx/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"

      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - "target/release/bundle/osx/${{ env.APP_NAME }}.app"

      - name: Zip the .app
        run: |
          cd target/release/bundle/osx
          zip -r ${{ env.APP_NAME }}-${{ needs.get-version.outputs.version }}-macos-universal.zip "${{ env.APP_NAME }}.app"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ needs.get-version.outputs.version }}-macos-universal
          path: target/release/bundle/osx/${{ env.APP_NAME }}-${{ needs.get-version.outputs.version }}-macos-universal.zip


      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build .dmg
        run: |
          cd target/release/bundle/osx
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${{ env.APP_NAME }}.app" 150 200 \
            --app-drop-link 450 200 \
            "${{ env.APP_NAME }}-macos.dmg" \
            "${{ env.APP_NAME }}.app" || true
          test -f "${{ env.APP_NAME }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-dmg
          path: target/release/bundle/osx/${{ env.APP_NAME }}-macos.dmg

  linux-tarball:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '--ciSkip')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libudev-dev \
            libasound2-dev

      - name: Build release
        run: cargo build --release

      - name: Package tarball
        run: |
          mkdir -p package/${{ env.APP_NAME }}
          cp target/release/${{ env.APP_NAME }} package/${{ env.APP_NAME }}/
          if [ -d assets ]; then cp -r assets package/${{ env.APP_NAME }}/; fi
          tar -czf ${{ env.APP_NAME }}-linux.tar.gz -C package ${{ env.APP_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux
          path: ${{ env.APP_NAME }}-linux.tar.gz

      - name: Build .deb
        run: cargo deb

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-deb
          path: target/debian/*.deb

      - name: Strip binary for rpm (cargo-generate-rpm requires this)
        run: strip -s target/release/${{ env.APP_NAME }}

      - name: Build .rpm
        run: cargo generate-rpm

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-rpm
          path: target/generate-rpm/*.rpm
