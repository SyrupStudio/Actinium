name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: package-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    env:
      BUILD_TYPE: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt (Linux/macOS)
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          cache: true

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libfuse2 patchelf desktop-file-utils

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${env:BUILD_TYPE}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package macOS .app
        if: runner.os == 'macOS'
        run: |
          APP_PATH="$(find build -type d -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in build output."
            exit 1
          fi
          cp -R "$APP_PATH" "Actinium.app"

      - name: Package Linux tarball + AppImage
        if: runner.os == 'Linux'
        run: |
          BIN_PATH="$(find build -type f -name 'Actinium' -perm -111 | head -n 1)"
          if [ -z "$BIN_PATH" ]; then
            echo "Actinium binary not found."
            exit 1
          fi

          mkdir -p AppDir/usr/bin
          cp "$BIN_PATH" AppDir/usr/bin/Actinium

          cat > AppDir/Actinium.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Actinium
          Exec=Actinium
          Icon=Actinium
          Categories=Development;
          EOF

          if [ -f assets/logo.png ]; then
            cp assets/logo.png AppDir/Actinium.png
          else
            sudo apt-get install -y imagemagick
            convert -size 256x256 xc:transparent AppDir/Actinium.png
          fi

          chmod +x AppDir/usr/bin/Actinium

          mkdir -p dist/linux
          cp AppDir/usr/bin/Actinium dist/linux/
          tar -C dist -czf Actinium-linux-executable.tar.gz linux

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir Actinium-linux-x86_64.AppImage

      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter Actinium.exe | Select-Object -First 1
          if (-not $exe) { throw "Actinium.exe not found." }

          New-Item -ItemType Directory -Force -Path dist\Actinium | Out-Null
          Copy-Item $exe.FullName dist\Actinium\Actinium.exe

          & windeployqt --release --dir dist\Actinium $exe.FullName

          Compress-Archive -Path dist\Actinium\* -DestinationPath Actinium-windows-portable.zip -Force

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Actinium-macos-app
          path: Actinium.app

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Actinium-linux
          path: |
            Actinium-linux-executable.tar.gz
            Actinium-linux-x86_64.AppImage

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Actinium-windows-portable
          path: Actinium-windows-portable.zip
